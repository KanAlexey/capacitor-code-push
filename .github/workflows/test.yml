name: test

# Every layer of the tests, and the publish of a new version. A pull request runs the tests; a push to master runs them too and then
# publishes the version in package.json to npm when that version is not there yet. One workflow file, because npm's trusted publishing
# names it: the package's Settings > Trusted Publisher on npmjs.com must say test.yml, with no environment.

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Vitest on src/ with its coverage floor, the type contract in test/types, ESLint, Prettier and the build docgen and rollup make.
  typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run test:unit:coverage
      - run: npm run typecheck:test
      - run: npm run eslint
      - run: npm run prettier -- --check
      - run: npm run build

  # Kotlin on the JVM: the state machine, staging, hashing and downloads, with no emulator. Fails below the Android floor; then the
  # library's own build and Android lint. Capacitor 8 builds with JDK 21.
  android-jvm:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run test:android:coverage
      - run: cd android && ./gradlew build
      - name: Keep the coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-android
          path: android/build/reports/coverage/test/debug
          if-no-files-found: ignore

  # XCTest of the Swift core on an iOS simulator (test/ios), with its floor; then the whole Swift package, Capacitor glue included,
  # built for a device. Capacitor 8's binaries need Xcode 26.
  ios-xctest:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run test:ios:coverage
      - run: npm run verify:ios
      - name: Keep the coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-ios
          path: coverage/ios.json
          if-no-files-found: ignore
      # A cancelled run leaves xcodebuild and the simulator running, which slows the runner's own clean-up for minutes.
      - name: Stop what the tests left running
        if: always()
        run: |
          pkill -f '[x]codebuild' || true
          xcrun simctl shutdown all || true

  # The demo app, built on the packed plugin, against a local CodePush server on an iOS simulator: install, cold start on a package,
  # rollback of one that never confirms, a diff, and the reset a new binary makes (test/e2e/run-ios.mjs).
  e2e-ios:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run test:e2e:ios
      - name: Stop what the tests left running
        if: always()
        run: |
          pkill -f '[x]codebuild' || true
          xcrun simctl shutdown all || true

  # The same scenario on an Android emulator. An emulator needs hardware acceleration, which the runner allows once /dev/kvm is
  # open; adb reverse inside the scenario gives it the runner's localhost.
  e2e-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          arch: x86_64
          script: ANDROID_SERIAL=emulator-5554 npm run test:e2e:android

  # Only a push to master gets here, and only when every test above passed. It publishes a version that npm does not have yet, and
  # nothing when the version is already there: a release is a version bump merged to master.
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [typescript, android-jvm, ios-xctest, e2e-ios, e2e-android]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # the tag and the release
      id-token: write # npm's trusted publishing signs in with this
    steps:
      - uses: actions/checkout@v4
        with:
          # the whole history: the tag goes on the commit that first carried the version
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          # npm 11.5 or newer is needed for trusted publishing
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - name: Publish a version that is new
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          # The name is not ours until somebody checks: an unrelated package on npm under the same name would hold this version, and
          # the check below would then say "already published" and skip without a word. Refuse instead.
          published=$(npm view "$name" repository.url 2>/dev/null || true)
          if [ -n "$published" ] && ! echo "$published" | grep -q 'KanAlexey/capacitor-code-push'; then
            echo "$name on npm belongs to another repository: $published"
            exit 1
          fi
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already published: nothing to do"
            exit 0
          fi
          npm publish --access public --provenance
      - name: Tag and release the version that is on npm
        # After the publish, and only after it: the tag goes on the commit the version was published from (the first one on master
        # that carries it), and the release takes the version's block of the changelog. Both are left alone when they exist, so a
        # re-run adds what is missing and changes nothing else.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          commit=$(node scripts/release.mjs commit "$version")
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "$tag is already on origin"
          else
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              tag -a "$tag" -m "$version" "$commit"
            git push origin "refs/tags/$tag"
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag exists"
          else
            node scripts/release.mjs notes "$version" > "$RUNNER_TEMP/notes.md"
            gh release create "$tag" --verify-tag --title "$version" --notes-file "$RUNNER_TEMP/notes.md"
          fi
