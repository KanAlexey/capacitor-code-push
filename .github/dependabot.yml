# Weekly updates for what this repository depends on. Dependabot reads this file from the default branch only.
# Capacitor's packages move together: @capacitor/core, @capacitor/android and @capacitor/ios (npm), the Android Gradle plugin and
# Kotlin in android/build.gradle (the versions Capacitor's template sets), and capacitor-swift-pm in Package.swift, so a Capacitor
# bump is made by hand, all of them at once.
version: 2

updates:
  # the workflows in .github/workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
    labels: [dependencies]

  # the plugin's dev dependencies: TypeScript, Vitest, ESLint, Prettier, rollup
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: '@capacitor/*'
      # TypeScript 7 is the rewritten compiler, and typescript-eslint (below 6.1) and the build do not take it yet.
      # Lift this once they do.
      - dependency-name: typescript
        versions: ['>=7']
    labels: [dependencies]

  # the demo app: Vite (Capacitor moves with the plugin, by hand)
  - package-ecosystem: npm
    directory: /demo
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: '@capacitor/*'
    labels: [dependencies]

  # ZIPFoundation, the one Swift dependency besides Capacitor
  - package-ecosystem: swift
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: capacitor-swift-pm
    labels: [dependencies]
